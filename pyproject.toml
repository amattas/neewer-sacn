[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neewer-ble"
version = "0.1.0"
description = "BLE protocol library for Neewer LED lights — control, scenes, grouping, and audio-reactive effects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
audio = ["numpy>=1.24.0", "sounddevice>=0.4.6"]
tui = ["textual>=0.80.0"]
sacn = ["sacn>=1.9.0"]
full = [
    "neewer-ble[audio,tui,sacn]",
]
dev = [
    "neewer-ble[full]",
    "pytest>=7.0",
    "ruff",
    "mypy",
    "types-PyYAML",
    "bandit",
    "build",
    "twine",
]

[project.scripts]
neewer = "neewer.protocol:main_sync"
neewer-sacn = "neewer.sacn:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint/type/security config used by the shared python-ci checks (mattas-net/.github).
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E402: deferred imports after setup code; E741: short loop names (l); F841: names
# dict in the effect help text is documentation scaffolding. Tighten in follow-ups.
ignore = ["E402", "E741", "F841"]

[tool.ruff.lint.per-file-ignores]
# textual is an optional dependency probed with try/except ImportError.
"src/neewer/tui.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["sacn", "sounddevice"]
ignore_missing_imports = true

# B311: random is used for lighting effects, never for security. B110: best-effort
# cleanup paths intentionally swallow errors.
[tool.bandit]
skips = ["B311", "B110"]
