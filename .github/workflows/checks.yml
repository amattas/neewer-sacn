# Checks — automatic on push to main; on pull requests the run waits at the
# `approve` job until a reviewer approves it in the `approval` environment. The
# Release workflow requires a successful run of this workflow on main HEAD.
#
# Required checks (default-branch ruleset): "checks" and "security" (alias jobs below).
# See mattas-net/.github STANDARD.md.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  python:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: mattas-net/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
    with:
      python-versions: '["3.12", "3.13", "3.14"]'
      lint-paths: src tests
      extra-lint: bandit -q -c pyproject.toml -r src
      typecheck: python -m mypy src
      audit: strict

  checks:
    needs: python
    if: always() # a skipped required check counts as passing, so always run and assert
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared checks job
        env:
          RESULT: ${{ needs.python.outputs.checks-result }}
        run: test "$RESULT" = success

  security:
    needs: python
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared security job
        env:
          RESULT: ${{ needs.python.outputs.security-result }}
        run: test "$RESULT" = success
